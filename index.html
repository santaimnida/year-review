<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>그 돈으로 뭘 했냐면요</title>
<link rel="preconnect" href="https://statics.goorm.io" crossorigin>
<link rel="stylesheet" href="https://statics.goorm.io/fonts/GoormSansCode/v1.0.1/GoormSansCode.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fonts-archive/D2Coding/D2Coding.css">
<style>
  :root{
    --bg:#F0EEE9;
    --panel:#F8F6F1;
    --ink:#1C1B19;
    --ink-dim:rgba(28,27,25,0.5);
    --ink-faint:rgba(28,27,25,0.28);
    --accent-deep:#0E86C8;

    --fs-ui:11px;
    --fs-primary:12px;
    --fs-note:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Goorm Sans Code','D2Coding', ui-monospace, 'Courier New', monospace;
    font-size:var(--fs-primary);
    font-weight:400;
    line-height:1.55;
    padding:52px 20px 90px;
    font-style:normal;
    transition:background-color .25s ease;
  }
  .page{max-width:700px;margin:0 auto;}

  /* terminal intro */
  .masthead{margin-bottom:26px;}
  .terminal-intro{font-size:var(--fs-ui);line-height:1.3;color:var(--accent-deep);}
  .t-line{white-space:pre-wrap;}
  .t-blank{height:0.8em;}
  .cursor{
    display:inline-block;width:6px;height:1em;background:var(--accent-deep);
    vertical-align:text-bottom;margin-left:4px;
    animation:blink 1.1s step-end infinite;
  }
  @media (prefers-reduced-motion: reduce){.cursor{animation:none;}}
  @keyframes blink{50%{opacity:0;}}

  /* year tabs */
  .nav{
    display:flex;
    gap:14px;
    font-size:var(--fs-ui);
    flex-wrap:wrap;
    align-items:baseline;
    margin-bottom:22px;
  }
  .tab{
    background:none;
    border:none;
    font-family:inherit;
    font-size:var(--fs-ui);
    font-weight:400;
    color:var(--ink);
    cursor:pointer;
    padding:2px 0;
    transition:color .2s ease;
  }
  .tab.active{
    color:var(--accent-deep);
    text-decoration:underline;
    text-underline-offset:3px;
  }
  .tab:focus-visible{outline:1px solid var(--ink);outline-offset:2px;}
  .nav-empty{font-size:var(--fs-ui);color:var(--ink-dim);}

  #loadingMsg{font-size:var(--fs-ui);color:var(--ink-dim);}

  body.loading{background:#ffffff;}
  body.loading,
  body.loading .terminal-intro,
  body.loading .t-info,
  body.loading .t-prompt{color:#4a4a4a;}
  body.loading .cursor{background:#4a4a4a;}
  body.loading #loadingMsg{color:#000000;}

  .category{margin-bottom:24px;}
  .category:last-child{margin-bottom:0;}

  .sec-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:10px;
    margin-bottom:10px;
  }
  .sec-head .tag{
    font-weight:400;
    white-space:nowrap;
    font-size:var(--fs-ui);
  }
  .sec-head .count{
    font-size:var(--fs-note);
    color:var(--ink-dim);
  }

  .entry{
    display:flex;
    gap:10px;
    align-items:baseline;
    padding:3px 0;
  }
  .entry .idx{
    color:var(--ink-dim);
    font-size:var(--fs-ui);
    white-space:nowrap;
    flex-shrink:0;
    min-width:14px;
  }
  .entry .body{
    flex:1;
    min-width:0;
    word-break:keep-all;
    font-size:var(--fs-primary);
    font-weight:400;
  }
  .entry .primary{font-weight:400;}
  .entry .sep{color:var(--ink-faint);padding:0 6px;}
  .entry .secondary{font-weight:400;}
  .entry .note{font-size:var(--fs-note);color:var(--ink-dim);}
  .answer{}
  .single-body{padding:2px 0;min-height:1.4em;}

  footer{
    margin-top:48px;
    text-align:center;
    font-size:var(--fs-ui);
    color:var(--ink-dim);
  }

  @media (max-width:520px){
    body{padding:36px 16px 72px;}
  }
</style>
</head>
<body class="loading">
<div class="page">

  <div class="masthead">
    <div class="terminal-intro">
      <div class="t-line t-cmd">&gt; run year_review</div>
      <div class="t-line t-blank">&nbsp;</div>
      <div class="t-line t-info"><span class="tag-info">[INFO]</span> analyzing yearly activities...</div>
      <div class="t-line t-info"><span class="tag-info">[INFO]</span> calculating expenses...</div>
      <div class="t-line t-info"><span class="tag-info">[INFO]</span> loading memories...</div>
      <div class="t-line t-blank">&nbsp;</div>
      <div class="t-line t-prompt">$ where_did_my_money_go?<span class="cursor"></span></div>
    </div>
  </div>

  <div id="loadingMsg">loading...</div>
  <div class="nav" id="nav" style="display:none;"></div>

  <div id="years-container"></div>

  <footer>&lt;!-- 이 페이지는 나 좋으라고 만들었습니다 --&gt;</footer>

</div>

<script>
(function(){
  // ===== CONFIG =====
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzORQvAqexhIE1mskFPiYQVQY1y137iT5D5nyltsY1XALOEb1lRpbDuAErSCj1pcAgw/exec';
  const CACHE_KEY = 'yearly_recap_cache_v1';

  let data = { years: [] };
  let selectedYear = null;

  function el(tag, cls, text){
    const e = document.createElement(tag);
    if(cls) e.className = cls;
    if(text !== undefined) e.textContent = text;
    return e;
  }

  function normalize(d){
    d = d || { years: [] };
    d.years = d.years || [];
    d.years.forEach(y=>{
      if(!y.bg) y.bg = '#F0EEE9';
      if(!y.point) y.point = '#0E86C8';
      y.movie = y.movie || '';
      y.book = y.book || '';
      y.sentence = y.sentence || '';
      y.albums = y.albums || [];
      y.concertAnswers = y.concertAnswers || [];
      while(y.concertAnswers.length < 10) y.concertAnswers.push('');
      y.travels = y.travels || [];
      y.achievements = y.achievements || [];
    });
    return d;
  }

  function showLoaded(){
    document.getElementById('loadingMsg').style.display = 'none';
    document.getElementById('nav').style.display = '';
    document.body.classList.remove('loading');
  }

  async function loadData(){
    // show cached data instantly if we have it, then refresh quietly in the background
    let hadCache = false;
    try{
      const cached = localStorage.getItem(CACHE_KEY);
      if(cached){
        data = normalize(JSON.parse(cached));
        hadCache = true;
        showLoaded();
        renderAll();
      }
    } catch(e){ /* ignore cache errors */ }

    try{
      const res = await fetch(APPS_SCRIPT_URL, { method:'GET' });
      const json = await res.json();
      data = normalize(json);
      try{ localStorage.setItem(CACHE_KEY, JSON.stringify(data)); } catch(e){}
    } catch(e){
      console.error('load failed', e);
      if(!hadCache) data = { years: [] };
    }
    showLoaded();
    renderAll();
  }

  function applyTheme(y){
    const root = document.documentElement;
    root.style.setProperty('--bg', (y && y.bg) || '#F0EEE9');
    root.style.setProperty('--accent-deep', (y && y.point) || '#0E86C8');
  }

  function joinParts(container, parts){
    const main = parts.slice(0, -1);
    const note = parts[parts.length - 1];
    main.forEach((p,i)=>{
      container.appendChild(el('span', p.cls, p.text));
      if(i < main.length-1) container.appendChild(el('span','sep','—'));
    });
    if(note && note.text && note.text.trim() !== ''){
      if(main.length) container.appendChild(el('span','sep','*'));
      container.appendChild(el('span', note.cls, note.text));
    }
  }

  function makeViewRow(idxLabel, parts){
    const row = el('div','entry');
    row.appendChild(el('div','idx', idxLabel));
    const body = el('div','body');
    joinParts(body, parts);
    row.appendChild(body);
    return row;
  }

  const CONCERT_QUESTIONS = [
    '올해 총 공연에 간 횟수 (예정 포함)',
    '올해 총 공연에 쓴 돈',
    '가장 재밌게 본 공연',
    '가장 많이 관람한 아티스트',
    '가장 많이 방문한 공연장',
    '올해의 도전',
    '작년 목표를 달성했는가',
    '내년 목표',
    '내년에 보는 첫 공연',
    '공연 총 후기',
  ];

  const CATEGORIES = [
    { type:'single', key:'sentence', tag:'[올해의 문장]' },
    {
      type:'list', key:'albums', tag:'[올해의 노래]',
      countLabel: arr => arr.length + ' TRACKS',
      rowFields: (item, idx) => ({
        idx: String(idx+1).padStart(2,'0'),
        parts: [
          {cls:'primary', text:item.artist},
          {cls:'secondary', text:item.title},
          {cls:'note', text:item.note || ''},
        ],
      }),
    },
    { type:'survey', key:'concertAnswers', tag:'[올해의 공연]', questions: CONCERT_QUESTIONS },
    {
      type:'list', key:'travels', tag:'[올해의 여행]',
      countLabel: arr => arr.length + ' TRIPS',
      rowFields: (item) => ({
        idx: item.period || '--',
        parts: [
          {cls:'primary', text:item.location},
          {cls:'note', text:item.note || ''},
        ],
      }),
    },
    {
      type:'list', key:'achievements', tag:'[올해 새로 이룬 것]',
      countLabel: arr => arr.length + ' ITEMS',
      rowFields: (item, idx) => ({
        idx: String(idx+1).padStart(2,'0'),
        parts: [
          {cls:'primary', text:item.text},
        ],
      }),
    },
  ];

  function buildCategoryBlock(yearObj, cat){
    if(cat.type === 'single') return buildSingleCategory(yearObj, cat);
    if(cat.type === 'survey') return buildSurveyCategory(yearObj, cat);
    return buildListCategory(yearObj, cat);
  }

  function buildSingleCategory(yearObj, cat){
    const wrap = el('div','category');
    const head = el('div','sec-head');
    head.appendChild(el('span','tag', cat.tag));
    wrap.appendChild(head);

    const body = el('div','single-body');
    const val = yearObj[cat.key];
    if(val && val.trim() !== ''){
      body.appendChild(el('span','answer', val));
    }
    wrap.appendChild(body);
    return wrap;
  }

  function buildSurveyCategory(yearObj, cat){
    const wrap = el('div','category');
    const head = el('div','sec-head');
    head.appendChild(el('span','tag', cat.tag));
    wrap.appendChild(head);

    const list = el('div','list');
    const answers = yearObj[cat.key];
    cat.questions.forEach((q, i)=>{
      const row = el('div','entry');
      row.appendChild(el('div','idx', String(i+1).padStart(2,'0')));
      const body = el('div','body');
      body.appendChild(el('span', null, q));
      if(answers[i] && answers[i].trim() !== ''){
        body.appendChild(el('span','sep','—'));
        body.appendChild(el('span','answer', answers[i]));
      }
      row.appendChild(body);
      list.appendChild(row);
    });
    wrap.appendChild(list);
    return wrap;
  }

  function buildListCategory(yearObj, cat){
    const wrap = el('div','category');
    const head = el('div','sec-head');
    head.appendChild(el('span','tag', cat.tag));
    const countSpan = el('span','count', cat.countLabel(yearObj[cat.key]));
    head.appendChild(countSpan);
    wrap.appendChild(head);

    const list = el('div','list');
    yearObj[cat.key].forEach((item, idx)=>{
      const rf = cat.rowFields(item, idx);
      list.appendChild(makeViewRow(rf.idx, rf.parts));
    });
    wrap.appendChild(list);

    return wrap;
  }

  function buildYearSection(yearObj){
    const sec = el('section','year-block');
    sec.id = 'year-' + yearObj.year;
    CATEGORIES.forEach(cat=>{
      sec.appendChild(buildCategoryBlock(yearObj, cat));
    });
    return sec;
  }

  function renderAll(){
    const sorted = [...data.years].sort((a,b)=> b.year - a.year);

    if(selectedYear === null || !sorted.some(y=>y.year===selectedYear)){
      selectedYear = sorted.length ? sorted[0].year : null;
    }

    const current = sorted.find(y=>y.year===selectedYear);
    applyTheme(current);

    const nav = document.getElementById('nav');
    nav.innerHTML = '';
    if(sorted.length === 0){
      nav.appendChild(el('span','nav-empty','no years yet'));
    } else {
      sorted.forEach(y=>{
        const tab = el('button', 'tab' + (y.year===selectedYear ? ' active' : ''), String(y.year));
        tab.type = 'button';
        tab.addEventListener('click', ()=>{ selectedYear = y.year; renderAll(); });
        nav.appendChild(tab);
      });
    }

    const container = document.getElementById('years-container');
    container.innerHTML = '';
    if(current){
      container.appendChild(buildYearSection(current));
    }
  }

  loadData();
})();
</script>
</body>
</html>
